<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OSVC Dependency Graph</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sidebar">
  <h1>OSVC Dependency Graph</h1>
  <div class="sub" id="metaLine"></div>
  <input id="search" type="search" placeholder="Search components…">
  <div id="filters"></div>
  <label class="toggle"><input type="checkbox" id="orphansOnly"> Orphans only</label>
  <label class="toggle"><input type="checkbox" id="showLabels" checked> Show labels</label>
  <div id="legendNote">Dashed red ring = orphaned component.<br>
  Click a node to inspect its links. Drag nodes to rearrange. Scroll to zoom,
  drag background to pan.</div>
</div>
<div id="canvasWrap">
  <svg id="svg"><g id="viewport"><g id="edges"></g><g id="nodes"></g></g></svg>
  <div id="hint"></div>
  <div id="emptyState">
    <div><b>No graph data loaded.</b></div>
    <div>Run <code>python build.py &lt;path/to/master.json&gt;</code> in this folder,
    or drop a generated <code>data.js</code> next to this file.</div>
  </div>
</div>
<div id="inspector">
  <button id="closeBtn" title="Close">✕</button>
  <div id="inspBody"></div>
</div>

<!-- data.js must define window.GRAPH_DATA = {nodes, edges} and window.GRAPH_META = {...}
     It is generated by build.py — see README.md. Not present until you run the build. -->
<script src="data.js" onerror="console.warn('data.js not found — run build.py first')"></script>
<script src="app.js"></script>
</body>
</html>
